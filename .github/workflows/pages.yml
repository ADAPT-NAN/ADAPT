name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Only the files the browser needs; the local preview server and the
      # source-document text extracts stay out of the public site.
      - name: Stage site files
        run: |
          mkdir -p _site/content
          cp website/index.html website/styles.css website/app.js website/i18n.js _site/
          cp website/content/*.js _site/content/
          cp -r website/assets _site/assets
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
